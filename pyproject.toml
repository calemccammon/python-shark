[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-shark"
version = "0.1.0"
description = "Packet capture UI using NiceGUI and scapy"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "calem" } ]
dependencies = [
	"nicegui",
	"scapy",
]

[project.optional-dependencies]
dev = ["pytest"]
